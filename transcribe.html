<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transcribed Equations - Desmos Transcriber</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>📐 Transcribed Equations</h1>
      <p class="source-url" id="sourceUrl"></p>
    </header>
    
    <div class="controls">
      <button id="copyAllBtn" class="btn-primary">📋 Copy All Equations</button>
      <button id="downloadBtn" class="btn-secondary">💾 Download as Text</button>
    </div>
    
    <div class="equations-container" id="equationsContainer">
      <div class="loading">Loading equations...</div>
    </div>
  </div>
  
  <script src="transcribe.js"></script>
</body>
</html>

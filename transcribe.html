<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desmos Transcriber</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://www.desmos.com/api/v1.9/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
</head>
<body>
  <div class="container">
    <h1>📐 Desmos Transcriber</h1>
    
    <div class="url-input-section">
      <input type="text" id="desmosUrlInput" placeholder="Enter Desmos calculator URL to load..." />
      <button id="loadBtn" class="action-btn">🔗 Load Graph</button>
      <button id="clearBtn" class="action-btn secondary">🗑️ Clear</button>
    </div>
    
    <div class="transcribe-section">
      <button id="transcribeBtn" class="transcribe-btn">✨ Transcribe Equations</button>
      <span id="status" class="status-text"></span>
    </div>
    
    <div id="calculatorContainer" class="calculator-container"></div>
    
    <div id="controls" class="controls" style="display: none;">
      <button id="copyAllBtn" class="action-btn">📋 Copy All</button>
      <button id="downloadBtn" class="action-btn">💾 Download</button>
    </div>
    
    <div id="equationsContainer" class="equations-container"></div>
  </div>
  
  <script src="transcribe.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transcribed Equations - Desmos Transcriber</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📐 Transcribed Equations</h1>
      <p class="source-url" id="sourceUrl"></p>
    </header>
    
    <div class="url-input-section" id="urlInputSection" style="display: none;">
      <div class="input-group">
        <label for="desmosUrlInput">Enter Desmos Calculator URL:</label>
        <input 
          type="text" 
          id="desmosUrlInput" 
          placeholder="https://www.desmos.com/calculator/..."
          class="url-input"
        >
        <button id="extractBtn" class="btn-primary">Extract Equations</button>
      </div>
      <p class="hint">Or click the extension icon (∑) while on a Desmos calculator page</p>
    </div>
    
    <div class="progress-section" id="progressSection" style="display: none;">
      <h3>Transcribing Equations...</h3>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar">
          <span class="progress-text" id="progressText">0%</span>
        </div>
      </div>
      <p class="progress-status" id="progressStatus">Initializing...</p>
    </div>
    
    <div class="controls" id="controls" style="display: none;">
      <button id="copyAllBtn" class="btn-primary">📋 Copy All Equations</button>
      <button id="downloadBtn" class="btn-secondary">💾 Download as Text</button>
      <button id="newExtractionBtn" class="btn-tertiary">🔄 Extract Another</button>
    </div>
    
    <div class="equations-container" id="equationsContainer">
      <div class="loading">Checking for equations...</div>
    </div>
    
    <div class="debug-panel" id="debugPanel" style="display: none;">
      <h3>🔍 Debug Information</h3>
      <pre id="debugLog"></pre>
    </div>
  </div>
  
  <script src="transcribe.js"></script>
</body>
</html>
